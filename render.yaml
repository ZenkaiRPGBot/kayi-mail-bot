services:
  - type: web
    name: kayi-mail-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PING_URL
        sync: false
      - key: OWNER_ID
        value: "986380678"
