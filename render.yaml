services:
  - type: web
    name: kayi-mail-bot
    env: python
    plan: free
    region: frankfurt
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python -u bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PING_URL
        value: "https://kayi-mail-bot.onrender.com"
      - key: OWNER_ID
        value: "986380678"
      - key: LOG_CHANNEL_ID
        value: "-1004495645007"
      - key: RENDER_EMAIL
        value: "2305101270081@paruluniversity.ac.in"
      - key: RENDER_SERVICE_NAME
        value: "kayi-mail-bot"
      - key: PYTHONUNBUFFERED
        value: "1"
